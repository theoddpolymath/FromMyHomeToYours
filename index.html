<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Magic Of Animation Presentation In Colorful Handdrawn Style</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
/* 2. Setup the Screen Viewport Context */
html, body {
  width: 100vw;
  height: 100dvh; /* Safely accounts for browser ribbons and taskbars */
  overflow: hidden; /* Blocks all browser scrollbars completely */
  background-color: #e8e8e8;
  
  /* Flexbox handles the centering math perfectly without JavaScript */
  display: flex;
  justify-content: center;
  align-items: center;
}
/* 3. The Responsive Master Container (16:9 Widescreen) */
.app-screen {
  /* Using vmin ensures it scales down fluidly on short or narrow screens */
  width: 100vmin; 
  height: 56.25vmin; /* Maintains 16:9 ratio exactly (100 * 9 / 16) */
  
  max-width: 100vw;
  max-height: 100dvh;
  
  background-color: #333; /* Visual guide bounding box */
  display: flex;
  justify-content: center;
  align-items: center;
  flex-shrink: 0;
}
/* 4. Your Document Page Graphic (Now also 1920x1080 native layout) */
.page {
  position: relative;
  isolation: isolate;
  background: #fff;
  box-shadow: 0 4px 12px rgba(0, 0, 0, .15);
  overflow: hidden; /* Bounds child elements within the 16:9 box */

  /* Fill the 16:9 scaled canvas exactly */
  width: 100%;
  height: 100%;
}
/* The text-suppressed background raster (vectors + images), behind the text. */
.bg {
position: absolute;
left: 0;
top: 0;
z-index: 0;
user-select: none;
-webkit-user-select: none;
pointer-events: none;
}

/* Type3-only transparent overlay (Type3Mode.IMAGE): Type3 glyph shapes above the background, below text. */
.t3o {
position: absolute;
left: 0;
top: 0;
z-index: 0;
user-select: none;
-webkit-user-select: none;
pointer-events: none;
image-orientation: none;
}

/* A positioned text run. transform + font-size carry position/rotation/scale; the pooled style class
carries font-family/size/color. Runs are emitted in logical reading order (tagged PDFs) but carry an
inline z-index equal to their paint sequence, so visual stacking is unaffected by the DOM order. */
.t {
position: absolute;
left: 0;
top: 0;
z-index: 1;
white-space: pre;
line-height: 1;
transform-origin: 0 0;
display: inline-block;
}

/* An extracted image. Each element carries an inline z-index equal to its paint sequence (this class value
is only a fallback), so images stack correctly over/under text and vectors no matter the DOM order. */
.im {
position: absolute;
left: 0;
top: 0;
z-index: 1;
transform-origin: 0 0;
display: block;
/* PDF placement ignores EXIF Orientation; browsers honour it by default. Pass-through JPEGs may carry
an Orientation tag, so pin it off to match the PDF (no-op for re-encoded images, which have no EXIF). */
image-orientation: none;
}

/* An extracted vector layer (SVG). Carries an inline z-index equal to its group's paint sequence (this
class value is only a fallback), so it layers correctly against text and images regardless of DOM order. */
.vec {
position: absolute;
left: 0;
top: 0;
z-index: 1;
overflow: visible;
pointer-events: none;
}

/* Zero-size internal-link target anchor at a destination's exact Y; scroll lands here, not the page top. */
.dst {
position: absolute;
left: 0;
width: 0;
height: 0;
scroll-margin-top: 8px;
}

/* Zero-size holder for <clipPath> defs referenced by clipped vector paths; takes no layout space. */
.cdefs {
position: absolute;
width: 0;
height: 0;
overflow: hidden;
}

/* A detected ruled table (opt-in): a real, copyable/accessible <table> sized to the grid, laid over the
visual layer. Cells are transparent and border-less so the ruling lines and fills underneath show. */
.tbl {
position: absolute;
z-index: 1000000000; /* above the paint-order content band (runs/images/vectors carry z-index = paint seq) */
border-collapse: collapse;
table-layout: fixed;
margin: 0;
color: #000;
line-height: 1.1;
}
.tbl td {
border: 0;
padding: 1px 2px;
overflow: hidden;
vertical-align: middle;
text-align: left;
white-space: normal;
word-break: break-word;
}

/* Interactive link boxes and form controls, above the text/image/table layer (which uses a paint-order
z-index band). Kept below the fixed sidebars (z-index:10 in the root context; each .page isolates its
own high z-indexes). */
.lnk {
position: absolute;
z-index: 2000000000;
display: block;
}

.fld {
position: absolute;
z-index: 2000000000;
box-sizing: border-box;
font-size: 12px;
margin: 0;
}

/* Collapsible navigation sidebars (opt-in): outline (bookmarks) on the left, thumbnails on the right.
Both are fixed, scroll independently, sit above the pages and are hidden when printing. */
.toc, .thumbs {
position: fixed;
top: 0;
bottom: 0;
z-index: 10;
background: rgba(250, 250, 250, .97);
box-shadow: 0 0 6px rgba(0, 0, 0, .25);
overflow: auto;
font-family: sans-serif;
font-size: 13px;
-webkit-user-select: none;
user-select: none;
}
.toc {
left: 0;
width: 250px;
}
.thumbs {
right: 0;
width: 172px;
}
.toc summary, .thumbs summary {
cursor: pointer;
padding: 8px 10px;
font-weight: bold;
position: sticky;
top: 0;
background: inherit;
border-bottom: 1px solid #ddd;
}
.toc ul {
list-style: none;
margin: 0;
padding-left: 12px;
}
.toc li {
margin: 1px 0;
}
.toc a, .toc span {
display: block;
padding: 2px 6px;
text-decoration: none;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
.toc a {
color: #06c;
}
.toc a:hover {
text-decoration: underline;
background: #eef4ff;
}
.toc span {
color: #333;
}
.thumbs ol {
list-style: none;
margin: 0;
padding: 8px;
}
.thumbs li {
margin: 0 0 10px;
text-align: center;
}
.thumbs a {
text-decoration: none;
color: #666;
font-size: 11px;
}
.thumbs img {
display: block;
width: 140px;
height: auto;
margin: 0 auto 2px;
border: 1px solid #bbb;
background: #fff;
}
.thumbs a:hover img {
border-color: #06c;
box-shadow: 0 0 0 2px #cfe0ff;
}

/* Print / PDF round-trip: one source page per printed page, no chrome margins or shadow.
The exact paper size is pinned by a generated @page rule when all pages share one size. */
@media print {
body { background: #fff; }
.toc, .thumbs { display: none; }
.page { margin: 0; box-shadow: none; break-after: page; }
.page:last-child { break-after: auto; }
}
.c0{font-family:"f0", sans-serif;font-size:127.4px;color:#551e04}
.c1{font-family:"f1", sans-serif;font-size:36px;color:#551e04}
.c2{font-family:"f2", sans-serif;font-size:42.66px;color:#551e04}
@page{size:1920px 1080px;margin:0}
</style>

<script>
    const canvas = document.getElementById("appScreen");
    
    // Must exactly mirror the native dimensions set in the CSS above
    const nativeWidth = 1920; 
    const nativeHeight = 1080;

    function scaleCanvasToViewport() {
      // 1. Get exact viewable viewport space (minus browser ribbons/taskbars)
      const viewportWidth = window.innerWidth;
      const viewportHeight = window.innerHeight;

      // 2. Math calculation to get the maximum scaling limit without distortion
      const scaleX = viewportWidth / nativeWidth;
      const scaleY = viewportHeight / nativeHeight;
      const idealScale = Math.min(scaleX, scaleY);

      // 3. Calculate exact positioning offsets to center the scaled canvas perfectly
      const offsetX = (viewportWidth - (nativeWidth * idealScale)) / 2;
      const offsetY = (viewportHeight - (nativeHeight * idealScale)) / 2;

      // 4. Inject variables right into CSS
      canvas.style.setProperty('--zoom-factor', idealScale);
      canvas.style.setProperty('--offset-x', `${offsetX}px`);
      canvas.style.setProperty('--offset-y', `${offsetY}px`);
    }

    // Bind layout listeners for real-time recalculations
    window.addEventListener("resize", scaleCanvasToViewport);
    window.addEventListener("DOMContentLoaded", scaleCanvasToViewport);
  </script>
