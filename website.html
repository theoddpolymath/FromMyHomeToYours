<!DOCTYPE html>
<html>
<head>
<title>Unlock to Access</title>
<link rel="icon" type="image/png" href="https://theoddpolymath.github.io/FromMyHomeToYours/resources/padlock.png">
<meta http-equiv="content-type" content="text/html; charset=UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link rel="stylesheet" type="text/css" href="//fonts.googleapis.com/css?family=Comfortaa" />
<style>
    /* 1. Global Reset */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    
    /* 2. Lock the window boundary strictly */
    html, body {
        width: 100vw;
        height: 100dvh; /* Accounts for ribbons and taskbars */
        overflow: hidden; /* Eradicates all stray scrollbars */
        background-color: #f8f6ec;
        
        /* Keeps the container centered on the desktop monitor */
        display: flex;
        justify-content: center;
        align-items: center;
    }
    
    /* 3. The 16:9 Viewport Canvas */
    .app-screen {
        /* Hard-lock the design dimensions so inner coordinates do not warp */
        width: 1920px;
        height: 1080px;
        background-color: #333;
        
        /* Shift transform pivot point to the absolute top-left */
        transform-origin: top left;
        
        /* Scaled down uniformly via Javascript layout variables */
        transform: scale(var(--zoom-factor, 1));
        
        /* Eliminates layout flexing engine clipping issues */
        position: absolute; 
        left: var(--offset-x, 0px);
        top: var(--offset-y, 0px);
    }

    /* 4. The Document Base */
    .page {
        position: relative;
        isolation: isolate;
        background: #fff;
        box-shadow: 0 4px 12px rgba(0, 0, 0, .15);
        
        /* Fills the 1920x1080 absolute canvas layer flawlessly */
        width: 100%;
        height: 100%;
    }
    .login-overlay {
        position: absolute;
        /* top: 50%;
        left: 50%; */
        transform-origin: center;
        transform: translate(0%,0%); /* Locks the exact center of the box to the center of screen */
        z-index: 10;       /* Forces the card to sit in front of the SVG */
    }
    
    /* 4. General styling for the login card */
    .login-card {
        background-color: rgba(250, 250, 220); /* Semi-transparent white to pop off the SVG */
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2); 
        text-align: center;
        width: 1400px;
        height: 480px; 
    }
    
    .login-card h2 {
        margin-top: 0;
        color: #333;
        margin-bottom: 24px;
    }
    
    /* 5. Custom size and border edits for the input box */
    .input-field {
        width: 100%;             
        padding: 12px 16px;      /* Edits the height & interior size */
        box-sizing: border-box;  
        margin-bottom: 30px;
        margin-top: 30px;     
        font-size: 28px;         
        text-align: center;
        /* Custom Border Edits */
        border: 2px solid #5c6bc0; /* Custom color hex matching your SVG theme */
        border-radius: 6px;        /* Soft rounded corners */
        outline: none;           
        transition: border-color 0.3s ease; 
    }
    
    .input-field:focus {
        border-color: #3949ab;   /* Darker color when clicked into */
    }
    
    .submit-btn {
        width: 100%;
        padding: 12px;
        background-color: #5c6bc0;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 30px;
        cursor: pointer;
        font-weight: bold;
    }
    
    .submit-btn:hover {
        background-color: #3949ab;
    }
    
    h1 { 
        font-family: Comfortaa; 
        font-size: 36px; 
        font-style: normal; 
        font-variant: normal; 
        font-weight: 700; 
        line-height: 40px; 
    } 
    h2 { 
        font-family: Comfortaa; 
        font-size: 32px; 
        font-style: normal; 
        font-variant: normal; 
        font-weight: 500; 
        line-height: 35px;
        margin-bottom: 12px;
    }
    h3 { 
        font-family: Comfortaa; 
        font-size: 26px; 
        font-style: normal; 
        font-variant: light; 
        font-weight: 300; 
        line-height: 30px; 
        margin-top: 12px;
        margin-bottom: 12px;
    } 
    p { 
        font-family: Comfortaa; 
        font-size: 15px; 
        font-style: normal; 
        font-variant: normal; 
        font-weight: 700; 
        line-height: 30px; 
    } 
    blockquote { 
        font-family: Comfortaa; 
        font-size: 21px; 
        font-style: normal; 
        font-variant: normal; 
        font-weight: 400; 
        line-height: 30px; 
    } 
    pre { 
        font-family: Comfortaa; 
        font-size: 13px; 
        font-style: normal; 
        font-variant: normal; 
        font-weight: 400; 
        line-height: 18.5714px; 
    }
    .scaling {
        transform: scale(0.2);
        opacity: 0;
        /* transition: transform 1s ease, opacity 1s ease; */
        transform-origin: center;
    } 
    .scaled {
        transform: scale(1);
        opacity: 95;
        transition: transform 1s ease, opacity 1s ease;
        transform-origin: center;
    }
    .page svg {background-color:#fff}
    .site-content { 
            position: absolute;
            top: 0;
            left: 0;
            width: 100%; 
            height: 100%; 
            border: none; 
            z-index: 5;
            background: #f8f6ec;
        }

</style>
</head>
<body>
    <div class="app-screen" id="appScreen">
        <div style="width: 100% ;height:100%; display:flex; justify-content: center; align-items: center; position: absolute;">
            <iframe class="site-content" id="site-content" src="https://theoddpolymath.github.io/FromMyHomeToYours/Start.html" allow="autoplay"></iframe>
        </div>
        <!-- 2. The Continuous Background Audio -->
        <audio id="bg-music" loop>
            <source src="resources/roa-music-walk-around(chosic.com).mp3" type="audio/mpeg">
        </audio>
    </div>

<script>
    const canvas = document.getElementById("appScreen");
    
    const nativeWidth = 1920; 
    const nativeHeight = 1080;

    function forceFitScreen() {
      // Get the true live window space minus OS and browser interfaces
      const viewportWidth = window.innerWidth;
      const viewportHeight = window.innerHeight;

      // Determine standard aspect ratio downscaling factors
      const scaleX = viewportWidth / nativeWidth;
      const scaleY = viewportHeight / nativeHeight;
      const idealScale = Math.min(scaleX, scaleY);

      // Math coordinates to ensure equal spacing top/bottom and left/right
      const offsetX = (viewportWidth - (nativeWidth * idealScale)) / 2;
      const offsetY = (viewportHeight - (nativeHeight * idealScale)) / 2;

      // Inject changes synchronously into the CSS DOM Tree
      canvas.style.setProperty('--zoom-factor', idealScale);
      canvas.style.setProperty('--offset-x', `${offsetX}px`);
      canvas.style.setProperty('--offset-y', `${offsetY}px`);
    }

    // Recalculate instantly on startup and when screen layout alters
    window.addEventListener("resize", forceFitScreen);
    window.addEventListener("DOMContentLoaded", forceFitScreen);
  </script>
    <!-- The Embedded JavaScript -->
<script>
function playmusic() {
    const music = document.getElementById("bg-music");

    music.play().catch(err => {
        console.log("Audio failed to play:", err);
    });
}

window.addEventListener("message", function(event) {
    if (event.origin !== "https://theoddpolymath.github.io") return;

    if (event.data === "user-interaction") {
        playmusic();
    }
});
</script>
</body>
</html>
